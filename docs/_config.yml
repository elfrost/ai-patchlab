title: AI PatchLab Scans
description: >-
  Security scans of public repositories run with AI PatchLab — a local-first,
  open-source security scanner that orchestrates Semgrep, Gitleaks, Trivy, and
  pip-audit.
theme: jekyll-theme-cayman
markdown: kramdown
show_downloads: false
lang: en
author: Elfrost

# The cayman layout already carries {% seo %}, so jekyll-seo-tag emits the
# title/description/canonical/Open Graph block that this site has never had.
# jekyll-sitemap publishes /sitemap.xml - there was no sitemap at all, which
# is most of why 141k words of scan write-ups draw ~1 search visitor a fortnight.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - templates/
  - README.md
