name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor; 3.13 is what the maintainer runs locally.
        # Testing both catches stdlib removals (PEP 594 dropped `cgi` in 3.13),
        # which is exactly the class of breakage that took the local env down.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check scanner src/ tests/ fingerprint/

      - name: Black
        run: black --check scanner src/ tests/ fingerprint/

      - name: Pytest
        run: pytest tests/ -q
